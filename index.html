<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="start-con">
        <h2>Press the start button to start the game</h2>
        <button id="str-btn">Start</button>
    </div>

    <div class="game-con blur">
        <h1>Simon Game</h1>
        <h3></h3>

        <div class="container">
            <div class="upp-con">
                <div id="red" class="con-btn red" type="button"></div>
                <div id="yellow" class="con-btn yellow" type="button"></div>
            </div>

            <div class="low-con">
                <div id="green" class="con-btn green" type="button"></div>
                <div id="blue" class="con-btn blue" type="button"></div>
            </div>

        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
